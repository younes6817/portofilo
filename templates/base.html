<!DOCTYPE html>
<html lang="en" dir="ltr" data-language="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Younes — Full-stack Developer" data-fa="یونس — توسعه‌دهنده فول‌استک">Younes — Full-stack Developer</title>
    <meta name="description" data-en-content="Portfolio of Younes, a full-stack developer building Django systems, APIs, and focused web products." data-fa-content="پورتفولیوی یونس، توسعه‌دهنده فول‌استک متخصص در ساخت سامانه‌های جنگو، API و محصولات وب هدفمند." content="Portfolio of Younes, a full-stack developer building Django systems, APIs, and focused web products.">
    <meta name="theme-color" content="#050307">
    {% load static %}
    <script>
        try {
            const savedLanguage = sessionStorage.getItem('portfolio-language');
            if (savedLanguage === 'fa') {
                document.documentElement.lang = 'fa';
                document.documentElement.dir = 'rtl';
                document.documentElement.dataset.language = 'fa';
            }
        } catch (error) {
            // English remains the safe default when session storage is unavailable.
        }
    </script>
    <!-- Precompiled Tailwind (build with: npm run build:css) instead of the blocking
         ~400KB Play-CDN runtime compiler. Same Tailwind 3.4.17 engine => same output.
         Safety net: if this file is not on the server yet (static files not deployed /
         collected), fall back to the old runtime compiler instead of rendering an
         unstyled page. Never fires when the precompiled file is present. -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}"
          onerror="this.onerror=null;var t=document.createElement('script');t.src='{% static 'js/tailwind.js' %}';document.head.appendChild(t);">
    <link rel="icon" href="{{ MEDIA_URL }}logo/logoy.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}

    <style>
        {% include "language/_switcher.css" %}

        .inter {
            font-family: 'Inter', sans-serif;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
    <script>{% include "language/_switcher.js" %}</script>
</head>
<body class="bg-black">
    <div class="language-switcher" role="region" aria-label="Language selector" data-en-aria="Language selector" data-fa-aria="انتخاب زبان">
        <button id="language-toggle" class="language-switcher__button" type="button" aria-live="polite">
            <span class="language-switcher__icon" aria-hidden="true">文</span>
            <span data-language-toggle-label>تغییر زبان به فارسی</span>
        </button>
    </div>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
